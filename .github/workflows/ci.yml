name: build
on:
  push:
  pull_request:
jobs:
  arduino-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v1
      - name: Cache Arduino core
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
          key: ${{ runner.os }}-arduino-${{ hashFiles('scripts/build.sh') }}
      - name: Prepare Arduino directories
        run: |
          mkdir -p "$HOME/.arduino15"
          arduino-cli version
      - name: Init Arduino CLI config
        run: |
          arduino-cli config init || true
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/Ameba-AIoT/ameba-arduino-d/dev/Arduino_package/package_realtek_amebad_index.json
          arduino-cli config dump
      - name: Build with build.sh
        run: |
          bash scripts/build.sh
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-bin
          path: |
            /tmp/arduino/sketches/*/BW16-Repeater.ino.bin
            /tmp/arduino/sketches/*/application.axf
            build/*
          if-no-files-found: ignore
